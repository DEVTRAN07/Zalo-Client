name: Lint (Quick)

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck