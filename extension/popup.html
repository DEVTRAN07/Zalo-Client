<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zalo Credentials Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 380px; min-height: 380px; background: #f8f9fa; }
    .container { padding: 16px; }
    .header { display: flex; align-items: center; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid #e1e4e8; margin-bottom: 16px; }
    .logo { width: 32px; height: 32px; background: #0068ff; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 14px; }
    .title { font-size: 16px; font-weight: 600; color: #24292e; }
    .status { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    .status.success { background: #f0fff4; border: 1px solid #9be3a0; color: #22863a; }
    .status.error { background: #fff5f5; border: 1px solid #fca2a2; color: #cb2431; }
    .status.warning { background: #fffdef; border: 1px solid #fce89d; color: #bf8700; }
    .status-icon { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status.success .status-icon { background: #22863a; }
    .status.error .status-icon { background: #cb2431; }
    .status.warning .status-icon { background: #bf8700; }
    .credentials { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .cred-field { margin-bottom: 12px; }
    .cred-field:last-child { margin-bottom: 0; }
    .cred-label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 500; color: #586069; margin-bottom: 6px; }
    .cred-value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; padding: 8px 10px; word-break: break-all; max-height: 80px; overflow: auto; color: #24292e; }
    .cred-value.short { max-height: 40px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: #0068ff; color: #fff; }
    .btn-primary:hover { background: #0056d6; }
    .btn-secondary { background: #fff; color: #24292e; border: 1px solid #e1e4e8; }
    .btn-secondary:hover { background: #f6f8fa; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-icon { width: 16px; height: 16px; }
    .hidden { display: none !important; }
    .footer { margin-top: 16px; padding-top: 12px; border-top: 1px solid #e1e4e8; font-size: 11px; color: #8b949e; text-align: center; }
    .footer a { color: #0068ff; text-decoration: none; }
    .loading { display: flex; align-items: center; justify-content: center; padding: 24px; color: #586069; font-size: 13px; }
    .spinner { width: 18px; height: 18px; border: 2px solid #e1e4e8; border-top-color: #0068ff; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cred-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
    .badge-success { background: #f0fff4; color: #22863a; }
    .badge-danger { background: #fff5f5; color: #cb2431; }
    
    .cred-unified { }
    .cred-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .cred-label-inline { font-size: 12px; font-weight: 600; color: #586069; }
    .cred-secondary { margin-top: 10px; font-size: 11px; color: #586069; }
    .cred-secondary div { margin-bottom: 4px; }
    .cred-secondary-value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; color: #24292e; word-break: break-all; }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">ZC</div>
      <span class="title">Zalo Credentials Extractor</span>
    </div>

    <div id="status" class="status hidden"><div class="status-icon"></div><span id="statusText"></span></div>

    <div id="loading" class="loading hidden"><div class="spinner"></div><span>Đang trích xuất...</span></div>

    <div id="credentials" class="credentials hidden">
      <div class="cred-unified">
        <div class="cred-row">
          <span class="cred-label-inline">IMEI</span>
          <span id="imeiBadge" class="cred-badge badge-danger">Chưa có</span>
          <span id="cookieCount" class="cred-badge badge-danger">0 CK</span>
        </div>
        <div id="imeiValue" class="cred-value short"></div>
        <div class="cred-label-inline" style="margin-top:8px;">Cookies (JSON array)</div>
        <div id="cookieValue" class="cred-value"></div>
      </div>
      <div class="cred-secondary">
        <div><span class="cred-label-inline">User Agent:</span> <span id="uaValue" class="cred-secondary-value"></span></div>
        <div><span class="cred-label-inline">Language:</span> <span id="langValue" class="cred-secondary-value"></span></div>
      </div>
    </div>

    <div class="actions">
      <button id="extractBtn" class="btn btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 18l-5-5-5 5M12 3v12"/></svg>
        Trích xuất
      </button>
      <button id="copyBtn" class="btn btn-secondary hidden">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Sao chép JSON
      </button>
    </div>

    <div class="footer">Dùng với <a href="https://github.com/DEVTRAN07/Zalo-Client" target="_blank" rel="noreferrer">zalo-client</a> để đăng nhập API</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
